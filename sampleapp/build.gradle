plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace   'com.clevertap.sampleapp'
    compileSdk  34

    defaultConfig {
        applicationId 'com.clevertap.sampleapp'
        minSdk        21
        targetSdk     34
        versionCode   1
        versionName   '1.0.0'
    }

    buildTypes {
        debug {
            // debug builds are debuggable by default
            buildConfigField 'boolean', 'CLEVERTAP_DEBUG', 'true'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':sharedeventlib')

    // SCENARIO 2: host app's own CleverTap account — comment out for Scenario 1
    implementation 'com.clevertap.android:clevertap-android-sdk:6.2.1'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
}
